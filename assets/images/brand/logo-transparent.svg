<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Crater shape with transparent background -->
  <defs>
    <radialGradient id="craterGradient" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="innerCrater" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main crater circle -->
  <circle cx="100" cy="100" r="90" fill="url(#craterGradient)" stroke="#8c8c8c" stroke-width="3"/>
  
  <!-- Inner crater details -->
  <circle cx="70" cy="80" r="15" fill="url(#innerCrater)" opacity="0.8"/>
  <circle cx="130" cy="120" r="10" fill="url(#innerCrater)" opacity="0.6"/>
  <circle cx="110" cy="60" r="8" fill="url(#innerCrater)" opacity="0.7"/>
  <circle cx="60" cy="140" r="12" fill="url(#innerCrater)" opacity="0.5"/>
  
  <!-- Center highlight -->
  <circle cx="100" cy="100" r="25" fill="none" stroke="#8c8c8c" stroke-width="1" opacity="0.3"/>
  
  <!-- Company text (optional, can be removed for pure logo) -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8c8c8c" font-weight="bold">CRATER</text>
</svg>