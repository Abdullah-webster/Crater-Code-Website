<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Wrapper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="demoFrame" frameborder="0"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const demoPath = params.get('demo');
    if (demoPath) {
      document.getElementById('demoFrame').src = demoPath;
    }
  </script>
</body>
</html>
